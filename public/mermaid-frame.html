<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mermaid</title>
<style>
  body { margin: 0; font-family: inherit; }
  .mermaid { display: block; }
</style>
<script src="vendor/mermaid/mermaid.min.js"></script>
</head>
<body>
<div id="out"></div>
<script>
(function () {
  window.addEventListener('message', async (event) => {
    const data = event.data || {};
    if (data.type !== 'render') return;
    const source = String(data.source || '');
    const out = document.getElementById('out');
    out.textContent = '';
    const node = document.createElement('div');
    node.className = 'mermaid';
    node.textContent = source;
    out.appendChild(node);
    try {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', fontFamily: 'inherit' });
      await mermaid.run({ nodes: [node] });
      if (window.parent) window.parent.postMessage({ type: 'rendered', id: data.id, svg: node.innerHTML }, '*');
    } catch (e) {
      if (window.parent) window.parent.postMessage({ type: 'error', id: data.id, message: String(e && e.message || e) }, '*');
    }
  });
  if (window.parent) window.parent.postMessage({ type: 'ready' }, '*');
})();
</script>
</body>
</html>
